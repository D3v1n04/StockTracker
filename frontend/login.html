<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Sign in · StockTracker</title>
  <style>
    :root { color-scheme: light; --bg: #eef2f7; --panel: #fff; --text: #14213d; --muted: #64748b; --border: #dbe3ef; --accent: #0f766e; --danger: #b42318; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; font-family: Arial, sans-serif; color: var(--text); background: var(--bg); }
    main { width: min(100%, 390px); padding: 30px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); box-shadow: 0 16px 40px rgba(15, 23, 42, .08); }
    .eyebrow { margin: 0 0 6px; color: var(--accent); font-size: 13px; font-weight: 700; text-transform: uppercase; }
    h1 { margin: 0 0 8px; font-size: 30px; }
    .intro { margin: 0 0 24px; color: var(--muted); }
    label { display: block; margin: 14px 0 7px; font-size: 14px; font-weight: 700; }
    input { width: 100%; min-height: 44px; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; font: inherit; }
    input:focus { border-color: var(--accent); outline: 3px solid rgba(15, 118, 110, .18); }
    button { width: 100%; min-height: 44px; margin-top: 22px; border: 0; border-radius: 8px; color: white; background: var(--accent); font: inherit; font-weight: 700; cursor: pointer; }
    .error { margin: 0 0 16px; color: var(--danger); font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Private dashboard</p>
    <h1>Sign in</h1>
    <p class="intro">Enter your StockTracker credentials.</p>
    {message}
    <form method="post" action="/login" autocomplete="on">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" maxlength="1024" required autofocus />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required />
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
